name: Rust CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 fijado a propósito: ubuntu-latest migra a Ubuntu 26
        # desde 2026-10-19. No volver a ubuntu-latest sin revisar esa migración.
        os: [ubuntu-24.04, windows-latest]
        toolchain: ["1.88", stable]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: B4 Linux native cost smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Evidencia funcional; las cifras del runner NO son umbrales.
          test -x /usr/bin/time
          cargo build -p adaptive-agent --release --locked
          bash scripts/benchmarks/telemetry-b4-linux.sh target/release/adaptive-agent 5 1
