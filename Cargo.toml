[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/hardware-discovery",
    "crates/platform-windows",
    "crates/platform-linux",
    "apps/agent",
]
default-members = [
    "crates/domain",
    "crates/hardware-discovery",
    "crates/platform-windows",
    "crates/platform-linux",
    "apps/agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "=0.3.55", features = ["serde-well-known"] }
rustix = { version = "1.1", features = ["system"] }
wmi = { version = "=0.18.4", default-features = false }
tempfile = "3.27"

[workspace.lints.rust]
unused_must_use = "deny"
